<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entertainment News - NEWS Akkshu</title>
    <!-- AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4298712782505661" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hind', sans-serif; background-color: #f4f4f4; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; position: relative; }
        header img { width: 180px; cursor: pointer; }
        h1 { color: #d32f2f; margin-top: 10px; font-family: 'Poppins', sans-serif; }
        .container { max-width: 800px; margin: 0 auto; }
        .admin-box { display: none; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 5px solid #0B3054; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .publish-btn { background: #d32f2f; color: white; border: none; padding: 12px 25px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .news-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .ad-container { margin: 15px 0; }
    </style>
</head>
<body>

    <header>
        <!-- Logo par Double Click karne se Admin Panel open hoga -->
        <img src="1000678376.png" alt="NEWS Akkshu" ondblclick="checkPassword()" title="Double click for Admin">
        <h1>मनोरंजन (Entertainment News)</h1>
    </header>

    <div class="container">
        <div class="admin-box" id="adminBox">
            <h3>🔒 Admin Panel</h3>
            <form id="newsForm">
                <input type="text" id="newsHeading" placeholder="Heading..." required>
                <textarea id="newsDetails" rows="5" placeholder="Details..." required></textarea>
                <button type="submit" class="publish-btn">Publish</button>
            </form>
        </div>
        <div id="newsContainer"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOTuJcjYGPld5wZYVPHK0jpXKAh561lVU",
            authDomain: "news-akkshu.firebaseapp.com",
            projectId: "news-akkshu",
            storageBucket: "news-akkshu.firebasestorage.app",
            messagingSenderId: "735024392453",
            appId: "1:735024392453:web:30f8a1f0832ff36b1fef6c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Admin Panel Logic
        const SECRET_PASSWORD = "Akkshu@Admin";
        function checkPassword() {
            if (prompt("Enter Password:") === SECRET_PASSWORD) {
                sessionStorage.setItem('isAdmin', 'true');
                document.getElementById('adminBox').style.display = 'block';
            }
        }
        if(sessionStorage.getItem('isAdmin') === 'true') document.getElementById('adminBox').style.display = 'block';

        // Publish News
        document.getElementById('newsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            db.collection("hindiEntertainmentNews").add({
                heading: document.getElementById('newsHeading').value,
                details: document.getElementById('newsDetails').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => alert("Published!"));
        });

        // Load News
        db.collection("hindiEntertainmentNews").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="news-card">
                        <h2>${data.heading}</h2>
                        <div class="ad-container">
                            <ins class="adsbygoogle" style="display:block" data-ad-format="auto"></ins>
                            <script>(adsbygoogle=window.adsbygoogle||[]).push({});<\/script>
                        </div>
                        <p>${data.details}</p>
                    </div>`;
            });
        });
    </script>
</body>
</html>
