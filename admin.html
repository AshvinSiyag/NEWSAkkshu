<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - NEWS Akkshu</title>
    <style>
        body { font-family: 'Poppins', sans-serif; padding: 20px; background: #f4f4f4; }
        .panel { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #d32f2f; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel">
    <h2>🔒 Admin Panel</h2>
    <form id="newsForm">
        <input type="text" id="newsHeading" placeholder="Headline..." required>
        <input type="text" id="newsImage" placeholder="Image URL...">
        <input type="text" id="newsVideo" placeholder="Video URL (Optional)...">
        <textarea id="newsDetails" rows="6" placeholder="Full News Details..." required></textarea>
        
        <select id="newsCategory">
            <!-- Hindi Categories -->
            <option value="hindiEntertainmentNews">Hindi Entertainment</option>
            <option value="hindiPoliticsNews">Hindi Politics</option>
            <option value="hindiSportsNews">Hindi Sports</option>
            <option value="hindiCrimeNews">Hindi Crime</option>
            
            <!-- Gujarati Categories -->
            <option value="gujaratiEntertainmentNews">Gujarati Entertainment (ગુજરાતી મનોરંજન)</option>
            <option value="gujaratiPoliticsNews">Gujarati Politics (ગુજરાતી રાજકારણ)</option>
            <option value="gujaratiSportsNews">Gujarati Sports (ગુજરાતી રમતગમત)</option>
            <option value="gujaratiCrimeNews">Gujarati Crime (ગુજરાતી ક્રાઈમ)</option>
        </select>
        
        <button type="submit">Publish News</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOTuJcjYGPld5wZYVPHK0jpXKAh561lVU",
        authDomain: "news-akkshu.firebaseapp.com",
        projectId: "news-akkshu",
        storageBucket: "news-akkshu.firebasestorage.app",
        messagingSenderId: "735024392453",
        appId: "1:735024392453:web:30f8a1f0832ff36b1fef6c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById('newsForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const cat = document.getElementById('newsCategory').value;
        db.collection(cat).add({
            heading: document.getElementById('newsHeading').value,
            image: document.getElementById('newsImage').value,
            video: document.getElementById('newsVideo').value,
            details: document.getElementById('newsDetails').value,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("News Published Successfully in " + cat + "!");
            document.getElementById('newsForm').reset();
        }).catch(err => alert("Error: " + err));
    });
</script>
</body>
</html>
