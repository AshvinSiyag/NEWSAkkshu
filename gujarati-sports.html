<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports News Gujarati - NEWS Akkshu</title>
    <!-- AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4298712782505661" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Vadodara', sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .news-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .news-image { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .full-news { display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; color: #333; line-height: 1.6; }
        .read-more { color: #d32f2f; font-weight: bold; margin-top: 10px; display: block; }
        .ad-container { margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <a href="gujarati.html">← પાછા જાઓ</a>
    <div id="newsContainer"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOTuJcjYGPld5wZYVPHK0jpXKAh561lVU",
        authDomain: "news-akkshu.firebaseapp.com",
        projectId: "news-akkshu",
        storageBucket: "news-akkshu.firebasestorage.app",
        messagingSenderId: "735024392453",
        appId: "1:735024392453:web:30f8a1f0832ff36b1fef6c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Gujarati Sports News collection ko load karein
    db.collection("gujaratiSportsNews").orderBy("timestamp", "desc").onSnapshot(snapshot => {
        const container = document.getElementById('newsContainer');
        container.innerHTML = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            const shortDetails = data.details ? data.details.substring(0, 100) + "..." : "";
            
            container.innerHTML += `
                <div class="news-card" onclick="toggleNews('${doc.id}')">
                    ${data.image ? `<img src="${data.image}" class="news-image">` : ''}
                    <h2>${data.heading}</h2>
                    
                    <!-- Ad 1: Headline ke niche -->
                    <div class="ad-container">
                        <ins class="adsbygoogle" style="display:block" data-ad-format="auto" data-ad-full-width-responsive="true" data-ad-client="ca-pub-4298712782505661"></ins>
                    </div>

                    <p id="short-${doc.id}">${shortDetails}</p>
                    
                    <div id="full-${doc.id}" class="full-news">
                        ${data.video ? `<video width="100%" controls><source src="${data.video}" type="video/mp4"></video>` : ''}
                        <p>${data.details}</p>
                        
                        <!-- Ad 2: News khulne par -->
                        <div class="ad-container">
                            <ins class="adsbygoogle" style="display:block" data-ad-format="auto" data-ad-full-width-responsive="true" data-ad-client="ca-pub-4298712782505661"></ins>
                        </div>
                    </div>
                    <span class="read-more">વધારે વાંચો (Read More)</span>
                </div>`;
            (adsbygoogle = window.adsbygoogle || []).push({});
        });
    });

    function toggleNews(id) {
        const full = document.getElementById('full-' + id);
        const short = document.getElementById('short-' + id);
        full.style.display = (full.style.display === 'block') ? 'none' : 'block';
        short.style.display = (full.style.display === 'block') ? 'none' : 'block';
    }
</script>
</body>
</html>
