<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entertainment News - NEWS Akkshu</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4298712782505661" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Hind', sans-serif; background-color: #f4f4f4; padding: 20px; }
        .admin-box { display: none; background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .news-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; cursor: pointer; }
        .news-image { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .full-news { display: none; margin-top: 10px; color: #555; }
        .delete-btn { background: #d32f2f; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <header style="text-align:center;">
        <img src="1000678376.png" width="180" onclick="checkPassword()" style="cursor:pointer;">
        <h1>मनोरंजन (Entertainment News)</h1>
    </header>

    <div class="admin-box" id="adminBox">
        <form id="newsForm">
            <input type="text" id="newsHeading" placeholder="Heading..." style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" id="newsImage" placeholder="Image URL..." style="width:100%; padding:10px; margin-bottom:10px;">
            <textarea id="newsDetails" rows="4" placeholder="Full Details..." style="width:100%; padding:10px; margin-bottom:10px;"></textarea>
            <button type="submit">Publish News</button>
            <button type="button" onclick="logout()">Log Out</button>
        </form>
    </div>

    <div id="newsContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        // (Firebase Config यहाँ पहले वाला ही रहेगा)
        const firebaseConfig = { /* ...config... */ }; 
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Publish News (Image URL ke saath)
        document.getElementById('newsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            db.collection("hindiEntertainmentNews").add({
                heading: document.getElementById('newsHeading').value,
                image: document.getElementById('newsImage').value,
                details: document.getElementById('newsDetails').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => location.reload());
        });

        // Load News
        db.collection("hindiEntertainmentNews").orderBy("timestamp", "desc").onSnapshot(snapshot => {
            const container = document.getElementById('newsContainer');
            container.innerHTML = '';
            snapshot.forEach(doc => {
                const data = doc.data();
                container.innerHTML += `
                    <div class="news-card" onclick="toggleNews('${doc.id}')">
                        ${sessionStorage.getItem('isAdmin') === 'true' ? `<button class="delete-btn" onclick="deleteNews('${doc.id}')">Delete</button>` : ''}
                        <img src="${data.image}" class="news-image">
                        <h2>${data.heading}</h2>
                        <div id="full-${doc.id}" class="full-news"><p>${data.details}</p></div>
                    </div>`;
            });
        });

        function toggleNews(id) {
            const el = document.getElementById('full-' + id);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }
        
        function checkPassword() { if(prompt("Password:") === "Akkshu@Admin") { sessionStorage.setItem('isAdmin', 'true'); location.reload(); } }
        function logout() { sessionStorage.removeItem('isAdmin'); location.reload(); }
        function deleteNews(id) { event.stopPropagation(); db.collection("hindiEntertainmentNews").doc(id).delete(); }
    </script>
</body>
</html>
