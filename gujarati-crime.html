db.collection("gujaratiCrimeNews").orderBy("timestamp", "desc").onSnapshot(snapshot => {
    const container = document.getElementById('newsContainer');
    container.innerHTML = '';
    
    // Ads ka code, <script> tag ko tod kar likha gaya hai taaki innerHTML mein error na aaye
    const adScript = '<script>(adsbygoogle = window.adsbygoogle || []).push({});<' + '/script>';
    const adCode = '<ins class="adsbygoogle" style="display:block" data-ad-format="auto" data-ad-full-width-responsive="true" data-ad-client="ca-pub-4298712782505661"></ins>' + adScript;

    snapshot.forEach(doc => {
        const data = doc.data();
        const shortDetails = data.details ? data.details.substring(0, 100) + "..." : "";
        
        container.innerHTML += `
            <div class="news-card" onclick="toggleNews('${doc.id}')">
                ${data.image ? `<img src="${data.image}" class="news-image">` : ''}
                <h2>${data.heading}</h2>
                
                <!-- Ad 1: Headline ke niche -->
                <div class="ad-container">
                    ${adCode}
                </div>

                <p id="short-${doc.id}">${shortDetails}</p>
                
                <div id="full-${doc.id}" class="full-news">
                    ${data.video ? `<video width="100%" controls><source src="${data.video}" type="video/mp4"></video>` : ''}
                    <p>${data.details}</p>
                    
                    <!-- Ad 2: News khulne par -->
                    <div class="ad-container">
                        ${adCode}
                    </div>
                </div>
                <span class="read-more">Read More</span>
            </div>`;
    });
});
