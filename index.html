<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to NEWS Akkshu</title>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4298712782505661" crossorigin="anonymous"></script>

    <link href="https://fonts.googleapis.com/css2?family=Hind:wght@500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #333; }
        .splash-container { text-align: center; background: #ffffff; padding: 50px 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08); max-width: 600px; width: 90%; }
        .logo-box img { width: 250px; cursor: pointer; margin-bottom: 30px; }
        .title-text { font-size: 18px; color: #555; margin-bottom: 30px; font-weight: 600; }
        .language-options { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        .lang-btn { text-decoration: none; font-family: 'Hind', sans-serif; font-size: 22px; font-weight: 700; padding: 15px 35px; border-radius: 50px; color: white; transition: all 0.3s ease; display: inline-block; min-width: 220px; }
        .btn-hindi { background: linear-gradient(135deg, #A81C21, #d32f2f); }
        .btn-gujarati { background: linear-gradient(135deg, #0B3054, #15508a); }
        .maker-credit { margin-top: 50px; font-size: 14px; color: #777; text-transform: uppercase; font-weight: 400; }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="logo-box">
            <!-- 5-Click Admin Access -->
            <img src="1000678376.png" alt="NEWS Akkshu Logo" onclick="countClicks()" id="logo">
        </div>

        <div class="title-text">अपनी भाषा चुनें / તમારી ભાષા પસંદ કરો</div>

        <div class="language-options">
            <a href="hindi.html" class="lang-btn btn-hindi">हिंदी ख़बर</a>
            <a href="gujarati.html" class="lang-btn btn-gujarati">ગુજરાતી સમાચાર</a>
        </div>
    </div>

    <div class="maker-credit">Website Made By <span>Ashvin Siyag</span></div>

    <script>
        // Admin Access Logic (5 Clicks)
        let clickCount = 0;
        function countClicks() {
            clickCount++;
            if (clickCount === 5) {
                clickCount = 0;
                openAdmin();
            }
        }

        function openAdmin() {
            const password = prompt("Admin Password:");
            if (password === "Akkshu@Admin") {
                window.location.href = "admin.html"; // सुनिश्चित करें कि admin.html फाइल आपके फोल्डर में है
            } else {
                alert("Galat Password!");
            }
        }
    </script>
</body>
</html>
